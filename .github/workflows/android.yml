name: Android build

on:
  push:
    paths: ["android/**", "test-vectors/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests + debug APK
        run: gradle -p android test assembleDebug --no-daemon --stacktrace
      # Private: only people with access to the repo's Actions tab can download this.
      - uses: actions/upload-artifact@v4
        with:
          name: EarGuard-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
