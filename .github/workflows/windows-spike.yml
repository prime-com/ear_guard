name: Windows spike builds

on:
  push:
    paths: ["spike/win-audio/**", ".github/workflows/windows-spike.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build spike/win-audio -c Release
