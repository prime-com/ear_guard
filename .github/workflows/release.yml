name: Release

# Builds all three apps. Pushing a tag like v0.1.0 also publishes them on the Releases page.
# "Run workflow" (manual) only builds and keeps the files as private artifacts: nothing is published.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [".github/workflows/release.yml"]   # a build-only test run whenever this file changes
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build menu-bar app
        run: |
          cd app/mac
          ./build-app.sh
          ditto -c -k --keepParent build/EarGuard.app ../../EarGuard-mac.zip
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: EarGuard-mac.zip }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet test app/windows/EarGuardCore.Tests -c Release
      - run: dotnet publish app/windows/EarGuardWin -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out
      - run: Move-Item out/EarGuard.exe EarGuard-windows.exe
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: EarGuard-windows.exe }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle -p android test assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk EarGuard-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: EarGuard-android.apk }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          generate_release_notes: true
          body: |
            Rough-estimate headphone loudness and weekly dose. Free, no account, nothing leaves your device.
            See the README for install steps. Builds are not code-signed, so macOS and Windows show a first-run warning.
